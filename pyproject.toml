[project]
name = "irmds"
version = "0.1.0"
description = "Intelligent Real-Time Monitoring & Decision System — domain-agnostic anomaly detection across vision, network, finance, and infrastructure."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Eishaan Khatri" }]

keywords = [
    "anomaly-detection",
    "real-time",
    "edge-ai",
    "computer-vision",
    "monitoring",
    "fastapi",
]

[project.scripts]
irmds = "cli.main:app"

[tool.setuptools.packages.find]
include = ["api*", "cli*", "core*", "modules*", "notifications*", "dashboard*"]
exclude = ["tests*", "data*", "logs*", "docker*", "models*", "docs*", "scripts*"]

# ─────────────────────────────────────────────
# Ruff — Fast Python linter & formatter
# ─────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # type-checking imports
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default argument (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["core", "modules", "api", "notifications", "cli", "dashboard"]

# ─────────────────────────────────────────────
# Mypy — Static type checking
# ─────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false          # Relaxed for rapid development
ignore_missing_imports = true          # Third-party stubs not always available

# ─────────────────────────────────────────────
# Pytest — Test runner configuration
# ─────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
